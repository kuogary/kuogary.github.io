<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Works — Kuo Ching Tsung</title>
  <meta name="description" content="Kuo Ching Tsung 作品列表">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #0a0a0a;
      --muted: #e6e6e6;
      --bar: 48px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      overflow-x: hidden;
    }

    /* ── 頂部選單（與首頁相同） ── */
    header {
      position: sticky; top: 0; z-index: 10;
      height: var(--bar);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--ink);
    }
    .logo {
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 4px 12px;
      font-family: "Anton", sans-serif;
      font-size: 15px; letter-spacing: 0.06em;
      color: var(--ink); text-decoration: none;
    }
    .menu { display: flex; flex: 1; justify-content: space-around; }
    .menu a, .contact {
      font-size: 12px; letter-spacing: 0.16em;
      color: var(--ink); text-decoration: none; text-transform: uppercase;
    }
    .menu a:hover, .menu a[aria-current] { text-decoration: underline; text-underline-offset: 4px; }
    .contact {
      background: var(--ink); color: var(--bg);
      border-radius: 999px; padding: 6px 12px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .contact::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bg);
    }

    /* ── 頁標題 ── */
    .pagehead {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 40px 12px 16px;
      border-bottom: 1px solid var(--ink);
    }
    .pagehead h1 {
      font-family: "Anton", sans-serif;
      font-weight: 400; text-transform: uppercase;
      font-size: clamp(56px, 12vw, 180px);
      line-height: 0.85;
      position: relative;
    }
    /* 眼睛畫布疊在字上；畫好後原本的字變透明（仍保留給搜尋與讀屏） */
    .pagehead h1 canvas {
      position: absolute; left: 0; top: 0;
      pointer-events: none;
    }
    .pagehead h1.eyed { color: transparent; }
    .pagehead .count { font-size: 12px; letter-spacing: 0.16em; }

    /* ── 作品格子：桌機兩欄，手機一欄 ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
    }
    .work {
      display: block;
      color: var(--ink); text-decoration: none;
      border-bottom: 1px solid var(--ink);
      padding: 12px;
    }
    .work:nth-child(odd) { border-right: 1px solid var(--ink); }
    .thumb {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--muted);
    }
    .thumb img, .thumb .ph {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform .5s ease;
    }
    .thumb img { display: block; }
    .ph {                                  /* 佔位：之後換成真圖 */
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; letter-spacing: 0.16em; color: #888;
    }
    .work:hover .thumb img, .work:hover .thumb .ph { transform: scale(1.04); }
    .meta {
      display: grid;
      grid-template-columns: 3em 1fr auto;
      gap: 8px;
      padding-top: 10px;
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .meta .title { font-weight: 500; }
    .work:hover .title { text-decoration: underline; text-underline-offset: 4px; }

    @media (max-width: 700px) {
      .menu .num { display: none; }
      .menu a, .contact { font-size: 11px; letter-spacing: 0.1em; }
      .logo { font-size: 13px; padding: 3px 9px; }
      .grid { grid-template-columns: 1fr; }
      .work:nth-child(odd) { border-right: 0; }
      .pagehead { padding-top: 28px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./">KUO CHING TSUNG</a>
    <nav class="menu">
      <a href="works.html" aria-current="page"><span class="num">01 </span>Works</a>
      <a href="about.html"><span class="num">02 </span>About</a>
    </nav>
    <a class="contact" href="contact.html">Contact</a>
  </header>

  <section class="pagehead">
    <h1>Works</h1>
    <span class="count">(06)</span>
  </section>

  <!-- 作品內容在 works-data.js 改；這裡依資料自動產生格子，每格連到 project.html?id=編號 -->
  <main class="grid" id="grid"></main>

  <script src="works-data.js"></script>
  <script>
    (function () {
      const grid = document.getElementById('grid');
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const pad = n => String(n).padStart(2, '0');
      grid.innerHTML = WORKS.map((w, i) => `
        <a class="work" href="project.html?id=${pad(i + 1)}">
          <div class="thumb">${w.cover
            ? `<img src="${esc(w.cover)}" alt="${esc(w.title)}" loading="lazy">`
            : `<div class="ph">IMAGE ${pad(i + 1)}</div>`}</div>
          <div class="meta"><span>${pad(i + 1)}</span><span class="title">${esc(w.title)}</span><span>${esc(w.year)} · ${esc(w.category)}</span></div>
        </a>`).join('');
      document.querySelector('.pagehead .count').textContent = `(${pad(WORKS.length)})`;
    })();
  </script>

  <script type="module" src="eyes-title.js"></script>
</body>
</html>
