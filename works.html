<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Works — Kuo Ching Tsung</title>
  <meta name="description" content="Kuo Ching Tsung 作品列表">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #0a0a0a;
      --muted: #e6e6e6;
      --bar: 48px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      overflow-x: hidden;
    }

    /* ── 頂部選單（與首頁相同） ── */
    header {
      position: sticky; top: 0; z-index: 10;
      height: var(--bar);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--ink);
    }
    .logo {
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 4px 12px;
      font-family: "Anton", sans-serif;
      font-size: 15px; letter-spacing: 0.06em;
      color: var(--ink); text-decoration: none;
    }
    .menu { display: flex; flex: 1; justify-content: space-around; }
    .menu a, .contact {
      font-size: 12px; letter-spacing: 0.16em;
      color: var(--ink); text-decoration: none; text-transform: uppercase;
    }
    .menu a:hover, .menu a[aria-current] { text-decoration: underline; text-underline-offset: 4px; }
    .contact {
      background: var(--ink); color: var(--bg);
      border-radius: 999px; padding: 6px 12px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .contact::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bg);
    }

    /* ── 頁標題 ── */
    .pagehead {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 40px 12px 16px;
      border-bottom: 1px solid var(--ink);
    }
    .pagehead h1 {
      font-family: "Anton", sans-serif;
      font-weight: 400; text-transform: uppercase;
      font-size: clamp(56px, 12vw, 180px);
      line-height: 0.85;
      position: relative;
    }
    /* 眼睛畫布疊在字上；畫好後原本的字變透明（仍保留給搜尋與讀屏） */
    .pagehead h1 canvas {
      position: absolute; left: 0; top: 0;
      pointer-events: none;
    }
    .pagehead h1.eyed { color: transparent; }
    .pagehead .count { font-size: 12px; letter-spacing: 0.16em; }

    /* ── 作品格子：桌機兩欄，手機一欄 ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
    }
    .work {
      display: block;
      color: var(--ink); text-decoration: none;
      border-bottom: 1px solid var(--ink);
      padding: 12px;
    }
    .work:nth-child(odd) { border-right: 1px solid var(--ink); }
    .thumb {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--muted);
    }
    .thumb img, .thumb .ph {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform .5s ease;
    }
    .thumb img { display: block; }
    .ph {                                  /* 佔位：之後換成真圖 */
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; letter-spacing: 0.16em; color: #888;
    }
    .work:hover .thumb img, .work:hover .thumb .ph { transform: scale(1.04); }
    .meta {
      display: grid;
      grid-template-columns: 3em 1fr auto;
      gap: 8px;
      padding-top: 10px;
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .meta .title { font-weight: 500; }
    .work:hover .title { text-decoration: underline; text-underline-offset: 4px; }

    @media (max-width: 700px) {
      .menu .num { display: none; }
      .menu a, .contact { font-size: 11px; letter-spacing: 0.1em; }
      .logo { font-size: 13px; padding: 3px 9px; }
      .grid { grid-template-columns: 1fr; }
      .work:nth-child(odd) { border-right: 0; }
      .pagehead { padding-top: 28px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./">KUO CHING TSUNG</a>
    <nav class="menu">
      <a href="works.html" aria-current="page"><span class="num">01 </span>Works</a>
      <a href="#"><span class="num">02 </span>About</a>
    </nav>
    <a class="contact" href="#">Contact</a>
  </header>

  <section class="pagehead">
    <h1>Works</h1>
    <span class="count">(06)</span>
  </section>

  <!-- 換真作品：把 <div class="ph">…</div> 換成 <img src="images/檔名.jpg" alt="說明">，再改名稱、年份、類別 -->
  <main class="grid">
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 01</div></div>
      <div class="meta"><span>01</span><span class="title">Untitled Work A</span><span>2025 · TD</span></div>
    </a>
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 02</div></div>
      <div class="meta"><span>02</span><span class="title">Untitled Work B</span><span>2025 · Rhino</span></div>
    </a>
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 03</div></div>
      <div class="meta"><span>03</span><span class="title">Untitled Work C</span><span>2024 · Installation</span></div>
    </a>
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 04</div></div>
      <div class="meta"><span>04</span><span class="title">Untitled Work D</span><span>2024 · TD</span></div>
    </a>
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 05</div></div>
      <div class="meta"><span>05</span><span class="title">Untitled Work E</span><span>2023 · Rhino</span></div>
    </a>
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 06</div></div>
      <div class="meta"><span>06</span><span class="title">Untitled Work F</span><span>2023 · Art</span></div>
    </a>
  </main>

  <script>
  /* WORKS 大字：用原字形當容器，把一顆顆眼睛沿筆畫塞進去（眼睛大小≈筆畫粗細）。
     失敗或不支援時保留原本黑字。 */
  (function () {
    const h1 = document.querySelector('.pagehead h1');
    const img = new Image();
    img.src = 'images/eyes.jpg';
    // eyes.jpg 裡眼球的位置（1024×1024 原圖，中心 512，半徑約 300）
    const EYE = { cx: 512, cy: 512, r: 300 };
    let canvas;

    function build() {
      const cs = getComputedStyle(h1);
      const size = parseFloat(cs.fontSize);
      const font = `${cs.fontWeight} ${size}px ${cs.fontFamily}`;
      const text = h1.textContent.trim().toUpperCase();
      const lineH = parseFloat(cs.lineHeight) || size * 0.85;

      // 量字形、算基線（跟 CSS 排字方式一致）
      const m = document.createElement('canvas').getContext('2d');
      m.font = font;
      const tm = m.measureText(text);
      const asc = tm.fontBoundingBoxAscent, desc = tm.fontBoundingBoxDescent;
      const bleed = Math.ceil(size * 0.25);                // 字形超出行高的部分
      const W = Math.ceil(tm.width) + 4, H = Math.ceil(lineH) + bleed * 2;
      const baseY = bleed + (lineH - (asc + desc)) / 2 + asc;

      // 1. 低解析度字形遮罩 → 每點到字外緣的距離
      const k = Math.min(1, 220 / H);                       // 運算用縮小比例
      const mw = Math.ceil(W * k), mh = Math.ceil(H * k);
      const mc = document.createElement('canvas'); mc.width = mw; mc.height = mh;
      const mx = mc.getContext('2d');
      mx.scale(k, k); mx.font = font; mx.fillStyle = '#000';
      mx.fillText(text, 0, baseY);
      const px = mx.getImageData(0, 0, mw, mh).data;
      const N = mw * mh, INF = 1e9, d = new Float32Array(N);
      for (let i = 0; i < N; i++) d[i] = px[i * 4 + 3] > 127 ? INF : 0;
      const a = 1, b = Math.SQRT2;                          // 兩趟掃描近似距離
      for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
        const i = y * mw + x; if (!d[i]) continue;
        let v = d[i];
        if (x > 0) v = Math.min(v, d[i - 1] + a); else v = Math.min(v, a);
        if (y > 0) {
          v = Math.min(v, d[i - mw] + a);
          if (x > 0) v = Math.min(v, d[i - mw - 1] + b);
          if (x < mw - 1) v = Math.min(v, d[i - mw + 1] + b);
        } else v = Math.min(v, a);
        d[i] = v;
      }
      for (let y = mh - 1; y >= 0; y--) for (let x = mw - 1; x >= 0; x--) {
        const i = y * mw + x; if (!d[i]) continue;
        let v = d[i];
        if (x < mw - 1) v = Math.min(v, d[i + 1] + a); else v = Math.min(v, a);
        if (y < mh - 1) {
          v = Math.min(v, d[i + mw] + a);
          if (x < mw - 1) v = Math.min(v, d[i + mw + 1] + b);
          if (x > 0) v = Math.min(v, d[i + mw - 1] + b);
        } else v = Math.min(v, a);
        d[i] = v;
      }

      // 2. 由大到小塞圓：每次挑剩餘空間最大的點放一顆眼睛
      let rMax = 0; for (let i = 0; i < N; i++) if (d[i] > rMax) rMax = d[i];
      const rMin = rMax * 0.45, eyes = [];
      const free = Float32Array.from(d);
      for (let n = 0; n < 200; n++) {
        let best = -1, br = 0;
        for (let i = 0; i < N; i++) if (free[i] > br) { br = free[i]; best = i; }
        if (best < 0 || br < rMin) break;
        const cx = best % mw, cy = (best / mw) | 0, r = Math.min(br, rMax);
        eyes.push({ x: (cx + 0.5) / k, y: (cy + 0.5) / k, r: r / k, rot: Math.random() * Math.PI * 2 });
        for (let i = 0; i < N; i++) {
          if (!free[i]) continue;
          const dx = (i % mw) - cx, dy = ((i / mw) | 0) - cy;
          const v = Math.sqrt(dx * dx + dy * dy) - r;
          if (v < free[i]) free[i] = Math.max(0, v);
        }
      }

      // 3. 畫：黑色字形打底，眼睛疊上去
      const dpr = window.devicePixelRatio || 1;
      if (!canvas) { canvas = document.createElement('canvas'); canvas.setAttribute('aria-hidden', 'true'); h1.appendChild(canvas); }
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      canvas.style.top = -bleed + 'px';
      const c = canvas.getContext('2d');
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.font = font; c.fillStyle = cs.color === 'rgba(0, 0, 0, 0)' ? '#0a0a0a' : cs.color;
      c.fillText(text, 0, baseY);
      for (const e of eyes) {
        c.save();
        c.translate(e.x, e.y); c.rotate(e.rot);
        c.beginPath(); c.arc(0, 0, e.r, 0, Math.PI * 2); c.clip();
        c.drawImage(img, EYE.cx - EYE.r, EYE.cy - EYE.r, EYE.r * 2, EYE.r * 2, -e.r, -e.r, e.r * 2, e.r * 2);
        c.restore();
      }
      h1.classList.add('eyed');
    }

    function run() { try { h1.classList.remove('eyed'); build(); } catch (err) { h1.classList.remove('eyed'); } }
    Promise.all([document.fonts.ready, img.decode()]).then(run).catch(function () {});
    let t; addEventListener('resize', function () { clearTimeout(t); t = setTimeout(run, 150); });
  })();
  </script>
</body>
</html>
