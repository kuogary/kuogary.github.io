<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Works — Kuo Ching Tsung</title>
  <meta name="description" content="Kuo Ching Tsung 作品列表">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #0a0a0a;
      --muted: #e6e6e6;
      --bar: 48px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      overflow-x: hidden;
    }

    /* ── 頂部選單（與首頁相同） ── */
    header {
      position: sticky; top: 0; z-index: 10;
      height: var(--bar);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--ink);
    }
    .logo {
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 4px 12px;
      font-family: "Anton", sans-serif;
      font-size: 15px; letter-spacing: 0.06em;
      color: var(--ink); text-decoration: none;
    }
    .menu { display: flex; flex: 1; justify-content: space-around; }
    .menu a, .contact {
      font-size: 12px; letter-spacing: 0.16em;
      color: var(--ink); text-decoration: none; text-transform: uppercase;
    }
    .menu a:hover, .menu a[aria-current] { text-decoration: underline; text-underline-offset: 4px; }
    .contact {
      background: var(--ink); color: var(--bg);
      border-radius: 999px; padding: 6px 12px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .contact::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bg);
    }

    /* ── 頁標題 ── */
    .pagehead {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 40px 12px 16px;
      border-bottom: 1px solid var(--ink);
    }
    .pagehead h1 {
      font-family: "Anton", sans-serif;
      font-weight: 400; text-transform: uppercase;
      font-size: clamp(56px, 12vw, 180px);
      line-height: 0.85;
      position: relative;
    }
    /* 眼睛畫布疊在字上；畫好後原本的字變透明（仍保留給搜尋與讀屏） */
    .pagehead h1 canvas {
      position: absolute; left: 0; top: 0;
      pointer-events: none;
    }
    .pagehead h1.eyed { color: transparent; }
    .pagehead .count { font-size: 12px; letter-spacing: 0.16em; }

    /* ── 作品格子：桌機兩欄，手機一欄 ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
    }
    .work {
      display: block;
      color: var(--ink); text-decoration: none;
      border-bottom: 1px solid var(--ink);
      padding: 12px;
    }
    .work:nth-child(odd) { border-right: 1px solid var(--ink); }
    .thumb {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--muted);
    }
    .thumb img, .thumb .ph {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform .5s ease;
    }
    .thumb img { display: block; }
    .ph {                                  /* 佔位：之後換成真圖 */
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; letter-spacing: 0.16em; color: #888;
    }
    .work:hover .thumb img, .work:hover .thumb .ph { transform: scale(1.04); }
    .meta {
      display: grid;
      grid-template-columns: 3em 1fr auto;
      gap: 8px;
      padding-top: 10px;
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .meta .title { font-weight: 500; }
    .work:hover .title { text-decoration: underline; text-underline-offset: 4px; }

    @media (max-width: 700px) {
      .menu .num { display: none; }
      .menu a, .contact { font-size: 11px; letter-spacing: 0.1em; }
      .logo { font-size: 13px; padding: 3px 9px; }
      .grid { grid-template-columns: 1fr; }
      .work:nth-child(odd) { border-right: 0; }
      .pagehead { padding-top: 28px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./">KUO CHING TSUNG</a>
    <nav class="menu">
      <a href="works.html" aria-current="page"><span class="num">01 </span>Works</a>
      <a href="#"><span class="num">02 </span>About</a>
    </nav>
    <a class="contact" href="#">Contact</a>
  </header>

  <section class="pagehead">
    <h1>Works</h1>
    <span class="count">(06)</span>
  </section>

  <!-- 換真作品：把 <div class="ph">…</div> 換成 <img src="images/檔名.jpg" alt="說明">，再改名稱、年份、類別 -->
  <main class="grid">
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 01</div></div>
      <div class="meta"><span>01</span><span class="title">Untitled Work A</span><span>2025 · TD</span></div>
    </a>
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 02</div></div>
      <div class="meta"><span>02</span><span class="title">Untitled Work B</span><span>2025 · Rhino</span></div>
    </a>
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 03</div></div>
      <div class="meta"><span>03</span><span class="title">Untitled Work C</span><span>2024 · Installation</span></div>
    </a>
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 04</div></div>
      <div class="meta"><span>04</span><span class="title">Untitled Work D</span><span>2024 · TD</span></div>
    </a>
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 05</div></div>
      <div class="meta"><span>05</span><span class="title">Untitled Work E</span><span>2023 · Rhino</span></div>
    </a>
    <a class="work" href="#">
      <div class="thumb"><div class="ph">IMAGE 06</div></div>
      <div class="meta"><span>06</span><span class="title">Untitled Work F</span><span>2023 · Art</span></div>
    </a>
  </main>

  <script type="module">
    /* WORKS 大字：後面是一片大大小小的 3D 眼球（跟滑鼠轉、閒置隨機飄，同首頁），
       WORKS 字形當遮罩，只露出字裡的眼球。失敗時保留原本黑字。 */
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const h1 = document.querySelector('.pagehead h1');
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
    catch (e) { throw e; }                           // 不支援 WebGL → 維持黑字
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const gl = renderer.domElement;                  // 眼球畫在這（不放進頁面）

    const out = document.createElement('canvas');    // 頁面上看到的：字形 × 眼球
    out.setAttribute('aria-hidden', 'true');
    h1.appendChild(out);
    const ctx = out.getContext('2d');

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -2000, 2000);
    camera.position.z = 1000;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 1.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.4);
    key.position.set(-0.6, 0.8, 1);
    scene.add(key);

    // 眼球：前半球貼虹膜、後半球眼白（與首頁相同）
    const half = start => {
      const g = new THREE.SphereGeometry(1, 48, 24, 0, Math.PI * 2, start, Math.PI / 2);
      g.rotateX(Math.PI / 2);
      return g;
    };
    const frontGeo = half(0), backGeo = half(Math.PI / 2);
    const nrm = frontGeo.attributes.normal, uv = frontGeo.attributes.uv;
    for (let i = 0; i < nrm.count; i++) uv.setXY(i, 0.5 + nrm.getX(i) * 0.5, 0.5 + nrm.getY(i) * 0.5);
    const tex = new THREE.TextureLoader().load('images/eyes.jpg');
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    const phong = { shininess: 69, specular: 0x777777 };
    const frontMat = new THREE.MeshPhongMaterial({ map: tex, ...phong });
    const backMat = new THREE.MeshPhongMaterial({ color: 0xf4f2ee, ...phong });

    let meshes = [], eyes = [], W = 1, H = 1, depth = 300, font = '', text = '', baseY = 0, ink = '#0a0a0a';
    const dummy = new THREE.Object3D();

    function build() {
      h1.classList.remove('eyed');
      const cs = getComputedStyle(h1);
      const size = parseFloat(cs.fontSize);
      font = `${cs.fontWeight} ${size}px ${cs.fontFamily}`;
      text = h1.textContent.trim().toUpperCase();
      ink = cs.color;
      const lineH = parseFloat(cs.lineHeight) || size * 0.85;
      ctx.font = font;
      const tm = ctx.measureText(text);
      const asc = tm.fontBoundingBoxAscent, desc = tm.fontBoundingBoxDescent;
      const bleed = Math.ceil(size * 0.25);
      W = Math.ceil(tm.width) + 4; H = Math.ceil(lineH) + bleed * 2;
      baseY = bleed + (lineH - (asc + desc)) / 2 + asc;

      const dpr = Math.min(devicePixelRatio || 1, 2);
      out.width = W * dpr; out.height = H * dpr;
      out.style.width = W + 'px'; out.style.height = H + 'px'; out.style.top = -bleed + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderer.setPixelRatio(dpr);
      renderer.setSize(W, H, false);
      Object.assign(camera, { left: -W / 2, right: W / 2, top: H / 2, bottom: -H / 2 });
      camera.updateProjectionMatrix();
      depth = H * 0.9;

      // 大大小小的眼球隨機塞滿整塊（由大到小，不重疊）
      const list = [], rMax = H * 0.2, rMin = H * 0.04;
      for (let r = rMax; r >= rMin; r *= 0.9) {
        for (let tries = 0; tries < 400; tries++) {
          const x = -W / 2 + Math.random() * W, y = -H / 2 + Math.random() * H;
          if (list.every(e => Math.hypot(e.x - x, e.y - y) > e.r + r + 1)) list.push({ x, y, r });
        }
      }
      eyes = list.map(e => ({ ...e, q: new THREE.Quaternion(),
        p1: Math.random() * 100, p2: Math.random() * 100, sp: 0.4 + Math.random() * 0.5 }));
      meshes.forEach(m => { scene.remove(m); m.dispose(); });
      meshes = [new THREE.InstancedMesh(frontGeo, frontMat, eyes.length),
                new THREE.InstancedMesh(backGeo, backMat, eyes.length)];
      meshes.forEach(m => scene.add(m));
      h1.classList.add('eyed');
    }

    // 滑鼠／手指位置（以字塊中心為原點、y 朝上）
    const ptr = { x: 0, y: 0, last: -1e9 };
    function setPtr(cx, cy) {
      const b = out.getBoundingClientRect();
      ptr.x = cx - b.left - W / 2; ptr.y = H / 2 - (cy - b.top); ptr.last = performance.now();
    }
    addEventListener('pointermove', e => setPtr(e.clientX, e.clientY), { passive: true });
    addEventListener('touchstart', e => setPtr(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    addEventListener('touchmove', e => setPtr(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const target = new THREE.Vector3(), want = new THREE.Quaternion();
    let prev = performance.now(), mix = 0, visible = true;
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(h1);   // 捲出畫面就不畫

    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min((now - prev) / 1000, 0.1); prev = now;
      if (!visible) return;
      const idle = now - ptr.last > 1500 && !reduce;
      mix += ((idle ? 1 : 0) - mix) * (1 - Math.exp(-dt / 0.8 * 3));
      const t = now / 1000, k = 1 - Math.exp(-dt / 0.12);
      eyes.forEach((e, idx) => {
        const wx = e.x + Math.sin(t * e.sp + e.p1) * depth * 0.9;
        const wy = e.y + Math.cos(t * e.sp * 0.8 + e.p2) * depth * 0.7;
        target.set(ptr.x * (1 - mix) + wx * mix, ptr.y * (1 - mix) + wy * mix, depth);
        dummy.position.set(e.x, e.y, 0);
        dummy.lookAt(target);
        want.copy(dummy.quaternion);
        e.q.slerp(want, k);
        dummy.quaternion.copy(e.q);
        dummy.scale.setScalar(e.r);
        dummy.updateMatrix();
        meshes.forEach(m => m.setMatrixAt(idx, dummy.matrix));
      });
      meshes.forEach(m => { m.instanceMatrix.needsUpdate = true; });
      renderer.render(scene, camera);

      // 字形當遮罩：先畫黑字，再只在字裡疊上眼球
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, W, H);
      ctx.font = font; ctx.fillStyle = ink;
      ctx.fillText(text, 0, baseY);
      ctx.globalCompositeOperation = 'source-atop';
      ctx.drawImage(gl, 0, 0, W, H);
    }

    document.fonts.ready.then(() => {
      build();
      let tm; addEventListener('resize', () => { clearTimeout(tm); tm = setTimeout(build, 150); });
      requestAnimationFrame(frame);
    });
  </script>
</body>
</html>
