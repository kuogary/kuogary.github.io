<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuo Ching Tsung</title>
  <meta name="description" content="Kuo Ching Tsung 個人作品集">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --ink: #0a0a0a;
      --bar: 48px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      overflow-x: hidden;
    }

    /* ── 頂部選單：細線＋等寬字 ── */
    header {
      position: sticky; top: 0; z-index: 10;
      height: var(--bar);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--ink);
    }
    .logo {
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 4px 12px;
      font-family: "Anton", sans-serif;
      font-size: 15px; letter-spacing: 0.06em;
      color: var(--ink); text-decoration: none;
    }
    .menu { display: flex; flex: 1; justify-content: space-around; }
    .menu a, .contact {
      font-size: 12px; letter-spacing: 0.16em;
      color: var(--ink); text-decoration: none; text-transform: uppercase;
    }
    .menu a:hover { text-decoration: underline; text-underline-offset: 4px; }
    .contact {
      background: var(--ink); color: var(--bg);
      border-radius: 999px; padding: 6px 12px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .contact::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bg);
    }

    /* ── 主畫面：大字在後，人像在前 ── */
    .stage {
      position: relative;
      height: calc(100svh - var(--bar));
      min-height: 420px;
      overflow: hidden;
    }
    /* 最底層：3D 眼球背景（Three.js 畫在這個 canvas） */
    #eyes {
      position: absolute; inset: 0; z-index: 0;
      width: 100%; height: 100%; display: block;
    }
    .bigname {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: flex-start;
      padding: 16px 12px 0;
      font-family: "Anton", sans-serif;
      text-transform: uppercase;
      line-height: 0.82;
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }
    .bigname { align-items: center; }
    .bigname span {
      display: block; white-space: nowrap; width: max-content;
      transform: scaleY(1.45);          /* 拉高字形，接近超窄粗體 */
      transform-origin: top center;     /* 從頂端往下拉高，字貼齊上緣 */
    }
    .bigname .line { display: none; }   /* 手機用的三行版，桌機隱藏 */
    .hero {
      position: absolute; z-index: 2;
      pointer-events: none;
      left: 50%; bottom: 0;
      transform: translateX(-50%);
      height: 88%;
      width: auto; max-width: 96vw;
      object-fit: contain;
      filter: drop-shadow(0 18px 24px rgba(0,0,0,.18));
    }

    @media (max-width: 700px) {
      .menu .num { display: none; }
      .menu a, .contact { font-size: 11px; letter-spacing: 0.1em; }
      .logo { font-size: 13px; padding: 3px 9px; }
      .bigname .full { display: none; }
      .bigname .line { display: block; }
      .bigname { line-height: 0.88; justify-content: flex-start; padding-top: 4%; }
      .bigname span { transform: none; }
      .hero { height: auto; width: 96vw; bottom: 6%; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="./">KUO CHING TSUNG</a>
    <nav class="menu">
      <a href="works.html"><span class="num">01 </span>Works</a>
      <a href="#"><span class="num">02 </span>About</a>
    </nav>
    <a class="contact" href="#">Contact</a>
  </header>

  <main class="stage">
    <canvas id="eyes" aria-hidden="true"></canvas>
    <h1 class="bigname" aria-label="Kuo Ching Tsung">
      <span class="full fit">Kuo Ching Tsung</span>
      <span class="line fit">Kuo</span>
      <span class="line fit">Ching</span>
      <span class="line fit">Tsung</span>
    </h1>
    <!-- 試驗：暫時拿掉人像（要還原就刪掉這行與下一行的註解符號）
    <img class="hero" src="images/hero-cutout.png" alt="3D 掃描半身像，嵌著眼睛、嘴、手的照片面板" width="912" height="818">
    -->
  </main>

  <script>
    // 讓每行大字剛好撐滿畫面寬度
    function fit() {
      const box = document.querySelector('.bigname');
      const w = box.clientWidth - 24;
      document.querySelectorAll('.fit').forEach(el => {
        if (getComputedStyle(el).display === 'none') return;
        el.style.fontSize = '100px';
        el.style.fontSize = (100 * w / el.scrollWidth) + 'px';
      });
    }
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(fit);
    addEventListener('resize', fit);
  </script>

  <!-- 3D 眼球背景：移植自 TD 檔 suc.20.toe 的 eyes 元件
       格子排列的眼球 → 看向滑鼠；滑鼠停下約 1.5 秒 → 改成各自隨機飄動 -->
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const canvas = document.getElementById('eyes');
    const stage = canvas.parentElement;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
    catch (e) { canvas.remove(); throw e; }          // 不支援 WebGL 就維持白底
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -2000, 2000);
    camera.position.z = 1000;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 1.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.4);
    key.position.set(-0.6, 0.8, 1);
    scene.add(key);

    // 眼球拆成前後兩個半球：前半球用「正面平面投影」貼虹膜，後半球純眼白
    // （若共用一顆球，跨過赤道的三角形會把虹膜拉成細線，看起來像側面裂痕）
    const half = start => {
      const g = new THREE.SphereGeometry(1, 48, 24, 0, Math.PI * 2, start, Math.PI / 2);
      g.rotateX(Math.PI / 2);                        // 半球的極點轉到正前方（+z）
      return g;
    };
    const frontGeo = half(0), backGeo = half(Math.PI / 2);
    const n = frontGeo.attributes.normal, uv = frontGeo.attributes.uv;
    for (let i = 0; i < n.count; i++) uv.setXY(i, 0.5 + n.getX(i) * 0.5, 0.5 + n.getY(i) * 0.5);

    const tex = new THREE.TextureLoader().load('images/eyes.jpg');
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    const phong = { shininess: 69, specular: 0x777777 };
    const frontMat = new THREE.MeshPhongMaterial({ map: tex, ...phong });
    const backMat = new THREE.MeshPhongMaterial({ color: 0xf4f2ee, ...phong });   // 與貼圖眼白同色

    let meshes = [], eyes = [], W = 1, H = 1, depth = 300;
    const dummy = new THREE.Object3D();

    function build() {
      W = stage.clientWidth; H = stage.clientHeight;
      renderer.setSize(W, H, false);
      Object.assign(camera, { left: -W / 2, right: W / 2, top: H / 2, bottom: -H / 2 });
      camera.updateProjectionMatrix();

      const s = Math.max(W, H) / 10;                 // 長邊約 10 顆（TD 原作 10×10）
      const cols = Math.ceil(W / s) + 1, rows = Math.ceil(H / s) + 1;
      const r = s * 0.47;
      depth = s * 2.2;                               // 越小轉得越多（對應 TD 的 ×1.8）
      meshes.forEach(m => { scene.remove(m); m.dispose(); });
      meshes = [new THREE.InstancedMesh(frontGeo, frontMat, cols * rows),
                new THREE.InstancedMesh(backGeo, backMat, cols * rows)];
      eyes = [];
      const ox = -(cols - 1) * s / 2, oy = -(rows - 1) * s / 2;
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        eyes.push({
          x: ox + i * s, y: oy + j * s, r,
          q: new THREE.Quaternion(),
          p1: Math.random() * 100, p2: Math.random() * 100, sp: 0.4 + Math.random() * 0.5
        });
      }
      meshes.forEach(m => scene.add(m));
    }

    // 滑鼠／手指位置（換成以畫面中心為原點、y 朝上）
    const ptr = { x: 0, y: 0, last: -1e9 };
    function setPtr(cx, cy) {
      const b = stage.getBoundingClientRect();
      ptr.x = cx - b.left - W / 2; ptr.y = H / 2 - (cy - b.top); ptr.last = performance.now();
    }
    addEventListener('pointermove', e => setPtr(e.clientX, e.clientY), { passive: true });
    addEventListener('touchstart', e => setPtr(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    addEventListener('touchmove', e => setPtr(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const target = new THREE.Vector3(), want = new THREE.Quaternion();
    let prev = performance.now(), mix = 0;           // mix：0＝跟滑鼠，1＝隨機飄

    function frame(now) {
      const dt = Math.min((now - prev) / 1000, 0.1); prev = now;
      const idle = now - ptr.last > 1500 && !reduce;
      mix += ((idle ? 1 : 0) - mix) * (1 - Math.exp(-dt / 0.8 * 3));   // 約 0.8 秒切換
      const t = now / 1000, k = 1 - Math.exp(-dt / 0.12);

      eyes.forEach((e, idx) => {
        const wx = e.x + Math.sin(t * e.sp + e.p1) * depth * 0.9;
        const wy = e.y + Math.cos(t * e.sp * 0.8 + e.p2) * depth * 0.7;
        target.set(ptr.x * (1 - mix) + wx * mix, ptr.y * (1 - mix) + wy * mix, depth);
        dummy.position.set(e.x, e.y, 0);
        dummy.lookAt(target);
        want.copy(dummy.quaternion);
        e.q.slerp(want, k);
        dummy.quaternion.copy(e.q);
        dummy.scale.setScalar(e.r);
        dummy.updateMatrix();
        meshes.forEach(m => m.setMatrixAt(idx, dummy.matrix));
      });
      meshes.forEach(m => { m.instanceMatrix.needsUpdate = true; });
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    build();
    addEventListener('resize', build);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
